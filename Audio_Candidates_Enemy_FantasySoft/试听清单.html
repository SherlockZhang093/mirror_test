<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>轻奇幻怪物音效试听</title>
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;background:#0c1421;color:#e7f4ff;margin:0;padding:32px;line-height:1.6}
    main{max-width:920px;margin:auto}.note{color:#a9c6d8}.pick{color:#77e0d7;font-weight:700}
    section{background:#142437;border:1px solid #29485f;border-radius:12px;padding:20px 22px;margin:20px 0}

<body><main>
  <h1>轻奇幻怪物声音：不恐怖版本</h1>
  <p class="note">三套声音都来自同一类生物，攻击、受伤、死亡的声线会保持一致。推荐先听 <span class="pick">A 小地精型</span>。</p>
  <section><h2>A 小地精型——怪物感最明确，短促但不恐怖</h2>
    <article><span>攻击</span><audio controls src="A_小地精型/攻击.wav"></audio></article>
    <article><span>受伤</span><audio controls src="A_小地精型/受伤.wav"></audio></article>
    <article><span>死亡</span><audio controls src="A_小地精型/死亡.wav"></audio></article>
  </section>
  <section><h2>B 泥偶型——沉闷、非人声、威胁感较低</h2>
    <article><span>攻击</span><audio controls src="B_泥偶型/攻击.wav"></audio></article>
    <article><span>受伤</span><audio controls src="B_泥偶型/受伤.wav"></audio></article>
    <article><span>死亡</span><audio controls src="B_泥偶型/死亡.wav"></audio></article>
  </section>
  <section><h2>C 幼兽型——更柔和、更像小型生物</h2>
    <article><span>攻击</span><audio controls src="C_幼兽型/攻击.wav"></audio></article>
    <article><span>受伤</span><audio controls src="C_幼兽型/受伤.wav"></audio></article>
    <article><span>死亡</span><audio controls src="C_幼兽型/死亡.wav"></audio></article>
  </section>
</main></body></html>
